name: e2e

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Referendum track: root, or whitelisted-caller (adds a Fellowship whitelist referendum on Collectives)"
        type: choice
        options: [root, whitelisted-caller]
        default: root
      executions:
        description: "Sweeps to drive: 'once' fires each sweep once; a number N drives the chunked sweep N times on live balances; 'all' drives it to full drain (pair with reduce_chunked_to)"
        type: string
        default: once
      enact_block:
        description: "Enactment block B for At(B) (empty = auto-pick; the dry-run relocates enactment to the current relay head regardless)"
        type: string
        default: ""
      reduce_chunked_to:
        description: "Cap the chunked holder's USDT+USDC in the fork to this 6-dp amount so 'all' finishes fast (empty = live balances)"
        type: string
        default: ""
      block_details:
        description: "Print every built block with its events on both forks (0 = off)"
        type: string
        default: "1"
      use_subway:
        description: "Front the public RPC endpoints with local subway proxies (caching + failover; ~5 min extra on cache miss)"
        type: boolean
        default: false
      prt_ref:
        description: "polkadot-referenda-tester git ref"
        type: string
        default: feat/post-test-hook

run-name: "e2e: ${{ inputs.track }}, executions=${{ inputs.executions }}${{ inputs.enact_block != '' && format(', enact@{0}', inputs.enact_block) || '' }}${{ inputs.reduce_chunked_to != '' && format(', reduce={0}', inputs.reduce_chunked_to) || '' }}"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout polkadot-referenda-tester (${{ inputs.prt_ref }})
        uses: actions/checkout@v4
        with:
          repository: karolk91/polkadot-referenda-tester
          ref: ${{ inputs.prt_ref }}
          path: prt
          token: ${{ secrets.PRT_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install & build polkadot-referenda-tester
        working-directory: prt
        run: |
          corepack enable
          yarn install --immutable
          yarn build
          test -f dist/cli.js

      - name: Install (generates PAPI descriptors from .papi metadata)
        run: npm ci

      - name: Cache subway binary
        if: ${{ inputs.use_subway }}
        id: subway-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/subway
          key: subway-${{ runner.os }}-v0.1.2

      - name: Install subway
        if: ${{ inputs.use_subway && steps.subway-cache.outputs.cache-hit != 'true' }}
        run: |
          if ! command -v cargo >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
          fi
          cargo install --git https://github.com/AcalaNetwork/subway --locked

      - name: Run e2e
        env:
          PRT_DIR: ${{ github.workspace }}/prt
          TRACK: ${{ inputs.track }}
          EXECUTIONS: ${{ inputs.executions }}
          ENACT_BLOCK: ${{ inputs.enact_block }}
          REDUCE_CHUNKED_TO: ${{ inputs.reduce_chunked_to }}
          BLOCK_DETAILS: ${{ inputs.block_details }}
          USE_SUBWAY: ${{ inputs.use_subway && '1' || '0' }}
          NODE_NO_WARNINGS: "1"
        shell: bash
        run: bash scripts/e2e-all.sh 2>&1 | tee e2e.log

      - name: Job summary (decoded schedules + exact calls + results)
        if: always()
        run: |
          {
            echo "## Hydration treasury consolidation e2e"
            echo
            echo "| parameter | value |"
            echo "|---|---|"
            echo "| track | \`${{ inputs.track }}\` |"
            echo "| executions | \`${{ inputs.executions }}\` |"
            echo "| enact block | \`${{ inputs.enact_block || '(auto)' }}\` |"
            echo "| reduce chunked to | \`${{ inputs.reduce_chunked_to || '(live balances)' }}\` |"
            echo "| subway | \`${{ inputs.use_subway }}\` |"
            echo "| prt ref | \`${{ inputs.prt_ref }}\` |"
            echo

            if [ -f out/summary-all.json ]; then
              echo "### Consolidation plan (decoded live)"
              echo '```json'
              jq '{track, beneficiary, delegateToAdd, enactAtBlock, sovereignAccountOnHydration,
                   tasks: [.tasks[] | {ref, mode, holder: .holder[0:8], addProxy,
                                       legacyPreimage: .legacy.preimageHash[0:10], legacySlot: .legacy.slot,
                                       needed: .plan.needed,
                                       usdt: (.amounts.usdt|tonumber/1e6), usdc: (.amounts.usdc|tonumber/1e6)}]}' \
                out/summary-all.json
              echo '```'
              echo
            fi

            if ls out/all-*.call >/dev/null 2>&1; then
              echo "### Exact calls"
              echo
              echo "The preimage + referendum submission below are exactly what was handed to the tester."
              echo
              for f in out/all-*.call; do
                [ -f "$f" ] || continue
                hex="$(tr -d '[:space:]' < "$f" | sed 's/^0x//')"
                echo "<details><summary><code>$(basename "$f")</code> ($(( ${#hex} / 2 )) bytes)</summary>"
                echo
                echo '```'
                echo "0x$hex"
                echo '```'
                echo "</details>"
              done
              echo
            fi

            echo "### Result"
            echo '```'
            grep -aE "Fellowship referendum #[0-9]+ (created|executed)|Governance referendum #[0-9]+ (created|executed)|BatchCompleted|Hydration XCM fees|quoted .* DOT|total over all executions|\[all\]|delegates:|legacy entry|preimage bytes|CallUnavailable=|left in agenda|fired:|already fired|holder drained|treasury gained|Post-referendum test passed|Workflow completed|AssertionError|Error:" e2e.log \
              | grep -avE "building #" | tail -60 || echo "(no result lines — see the uploaded log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_number }}
          path: |
            e2e.log
            out/
          if-no-files-found: ignore
          retention-days: 14
